name: PHP Linting
on:
  pull_request:
    types: [ opened, synchronize, reopened, ready_for_review ]
jobs:
  phplint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - name: Lint tracked PHP sources
        run: |
          git ls-files -z -- '*.php' ':(exclude)system/libs/polyfill-mbstring/bootstrap80.php' |
            xargs -0 -r -n 1 php -d error_reporting='E_ALL & ~E_DEPRECATED & ~E_USER_DEPRECATED' -l
