---
name: Format Prettier
on:
  pull_request:
    types: [ opened, synchronize, reopened, ready_for_review ]
permissions:
  contents: write
jobs:
  cancel-runs:
    if: github.event_name == 'pull_request' && github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Cancel Previous Runs
        uses: styfle/cancel-workflow-action@0.12.1
        with:
          access_token: ${{ github.token }}

  prettier:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Git
        if: ${{ github.ref != 'refs/heads/main' }}
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "GitHub Actions"

      - name: Actions checkout
        if: ${{ github.ref != 'refs/heads/main' }}
        uses: actions/checkout@v3
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        if: ${{ github.ref != 'refs/heads/main' }}
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install Dependencies
        if: ${{ github.ref != 'refs/heads/main' }}
        run: npm install prettier @prettier/plugin-php stylelint-prettier

      - name: Run prettier code format
        if: ${{ github.ref != 'refs/heads/main' }}
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          changed_files="$(git diff --name-only "origin/$BASE_REF"...HEAD -- '*.php' '*.js' '*.css')"
          if [ -z "$changed_files" ]; then
            exit 0
          fi
          printf '%s\n' "$changed_files" | grep -E '\.(php|js)$' | xargs -r npx prettier --write --plugin=@prettier/plugin-php --ignore-unknown
          printf '%s\n' "$changed_files" | grep -E '\.css$' | xargs -r npx stylelint --fix

      - name: Run add and commit
        if: ${{ github.ref != 'refs/heads/main' }}
        uses: EndBug/add-and-commit@v9
        with:
          author_name: GitHub Actions
          author_email: 41898282+github-actions[bot]@users.noreply.github.com
          message: 'PHP code format - (prettier)'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
