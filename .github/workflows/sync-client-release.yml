name: Sync verified client release

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

concurrency:
  group: site-client-release-sync
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - name: Test release validation
        run: python3 -m unittest discover -s tests -p 'test_sync_client_release.py'
      - name: Inspect latest verified OTClient release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/sync_client_release.py
      - name: Lint manifest and publish changed links
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git diff --quiet -- system/client-release.php; then
            expected=$(php -r '$release = require "system/client-release.php"; echo $release["version"];')
            live=$(curl -fsS --max-time 20 https://www.zealot.website/client-update.php | php -r '$data = json_decode(stream_get_contents(STDIN), true); if (!is_array($data) || !isset($data["version"])) { exit(1); } echo $data["version"];')
            if [ "$live" = "$expected" ]; then
              echo 'The website already has the latest verified release.'
              exit 0
            fi
            echo "Website has $live; deployment of $expected is still needed."
          else
            php -l system/client-release.php
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add system/client-release.php
            git commit -m 'chore(client): publish verified release download links'
            git push origin HEAD:main
          fi
          # GITHUB_TOKEN pushes do not start deploy workflows. Retry transient
          # API failures; later scheduled runs also recover a missed deployment.
          for attempt in 1 2 3; do
            if gh workflow run production-deploy.yml --ref main; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then sleep "$((attempt * 10))"; fi
          done
          echo '::error::Could not start the production deployment.'
          exit 1
