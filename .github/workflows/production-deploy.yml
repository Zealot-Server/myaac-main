name: Production CI and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: myaac-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  lint:
    name: PHP lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - name: Lint tracked PHP sources
        run: |
          git ls-files -z -- '*.php' ':(exclude)system/libs/polyfill-mbstring/bootstrap80.php' |
            xargs -0 -r -n 1 php -d error_reporting='E_ALL & ~E_DEPRECATED & ~E_USER_DEPRECATED' -l

  deploy:
    name: Deploy to Contabo
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Deploy the validated commit
        uses: appleboy/ssh-action@91f3272fc5907f4699dcf59761eb622a07342f5a
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          fingerprint: ${{ secrets.VPS_HOST_FINGERPRINT }}
          timeout: 30s
          command_timeout: 10m
          script: |
            set -euo pipefail

            APP_DIR=/opt/zealot/myaac-main
            STACK_DIR=/opt/zealot/canary/docker
            TARGET_SHA=${{ github.sha }}
            PREVIOUS_SHA="$(sudo git -C "$APP_DIR" rev-parse HEAD)"

            rollback() {
              sudo git -C "$APP_DIR" reset --hard "$PREVIOUS_SHA"
              sudo rm -rf "$APP_DIR/system/cache/twig"
              sudo docker compose -f "$STACK_DIR/docker-compose.yml" -f "$STACK_DIR/docker-compose.production.yml" restart myaac
            }

            sudo git -C "$APP_DIR" fetch origin main
            # The only tracked production changes are versioned in this commit.
            # Keep ignored local configuration (for example config.local.php) intact.
            sudo git -C "$APP_DIR" reset --hard
            sudo git -C "$APP_DIR" checkout --detach "$TARGET_SHA"
            sudo git -C "$APP_DIR" reset --hard "$TARGET_SHA"

            # Twig compilation is disabled in production. Remove only the generated
            # template cache so a deployed template is rendered immediately.
            sudo rm -rf "$APP_DIR/system/cache/twig"

            # OTClient assets are mounted read-only into MyAAC. They must still be
            # readable by Apache's www-data user so profile and highscore outfit
            # previews can be rendered from the canonical client catalogue.
            ASSETS_DIR=/opt/zealot/otclient/data/things
            if [ -d "$ASSETS_DIR" ]; then
              sudo find "$ASSETS_DIR" -type d -exec chmod a+rx {} +
              sudo find "$ASSETS_DIR" -type f -exec chmod a+r {} +
            fi

            if ! sudo "$APP_DIR/deploy/apply-migrations.sh"; then
              rollback
              exit 1
            fi

            if ! sudo docker compose -f "$STACK_DIR/docker-compose.yml" -f "$STACK_DIR/docker-compose.production.yml" restart myaac; then
              rollback
              exit 1
            fi

            ready=false
            for attempt in {1..10}; do
              if curl --fail --silent --show-error --max-time 5 http://127.0.0.1:8080/ >/dev/null 2>&1; then
                ready=true
                break
              fi
              sleep 2
            done

            if [ "$ready" != true ]; then
              rollback
              exit 1
            fi

            echo "Deployed $TARGET_SHA"
