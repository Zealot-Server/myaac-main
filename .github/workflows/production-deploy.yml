name: Production CI and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: myaac-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  lint:
    name: PHP lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: overtrue/phplint@3.4.0
        with:
          path: .
          options: --exclude="system/libs/polyfill-mbstring/bootstrap80.php"

  deploy:
    name: Deploy to Contabo
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Deploy the validated commit
        uses: appleboy/ssh-action@91f3272fc5907f4699dcf59761eb622a07342f5a
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          fingerprint: ${{ secrets.VPS_HOST_FINGERPRINT }}
          script_stop: true
          timeout: 30s
          command_timeout: 10m
          script: |
            set -euo pipefail

            APP_DIR=/opt/zealot/myaac-main
            STACK_DIR=/opt/zealot/canary/docker
            TARGET_SHA=${{ github.sha }}
            PREVIOUS_SHA="$(git -C "$APP_DIR" rev-parse HEAD)"

            rollback() {
              git -C "$APP_DIR" reset --hard "$PREVIOUS_SHA"
              sudo docker compose -f "$STACK_DIR/docker-compose.yml" -f "$STACK_DIR/docker-compose.production.yml" restart myaac
            }

            git -C "$APP_DIR" fetch origin main
            git -C "$APP_DIR" checkout --detach "$TARGET_SHA"
            git -C "$APP_DIR" reset --hard "$TARGET_SHA"

            if ! sudo "$APP_DIR/deploy/apply-migrations.sh"; then
              rollback
              exit 1
            fi

            if ! sudo docker compose -f "$STACK_DIR/docker-compose.yml" -f "$STACK_DIR/docker-compose.production.yml" restart myaac; then
              rollback
              exit 1
            fi

            if ! curl --fail --silent --show-error --max-time 15 http://127.0.0.1:8080/ >/dev/null; then
              rollback
              exit 1
            fi

            echo "Deployed $TARGET_SHA"
